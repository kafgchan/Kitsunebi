plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

sourceSets {
    shapeRegression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

tasks.register('shapeRegression', JavaExec) {
    dependsOn shapeRegressionClasses
    classpath = sourceSets.shapeRegression.runtimeClasspath
    mainClass = 'net.kafgchan.kitsunebi.ShapeRegression'
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('check') {
    dependsOn 'shapeRegression'
}

dependencies {
    compileOnly "net.fabricmc:fabric-loader:${project.loader_version}"
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    compileOnly "dev.architectury:architectury:${project.architectury_version}"
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

processResources {
    def expandProps = [
        "mod_id": project.mod_id,
        "mod_name": project.mod_name,
        "mod_version": project.mod_version,
        "minecraft_version": project.minecraft_version
    ]
    filesMatching(['pack.mcmeta']) {
        expand expandProps
    }
}
