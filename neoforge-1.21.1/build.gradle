plugins {
    id 'net.neoforged.moddev'
    id 'idea'
}

base {
    archivesName = "${project.mod_id}-neoforge-${project.minecraft_version}"
}

sourceSets.main.java {
    srcDir file('../common-1.21.1/src/main/java')
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
    srcDir file('../common-1.21.1/src/main/resources')
    srcDir file('../common-1.21.1/src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        compatVerifyClient {
            client()
            gameDirectory = file('build/compat-verify-client')
            programArguments.addAll '--width', '960', '--height', '720', '--quickPlaySingleplayer', 'compat-test'
            systemProperty 'kitsunebi.verifyCompat', 'true'
        }
        geckoVerifyServer {
            server()
            gameDirectory = file('build/gecko-network-server')
            programArgument '--nogui'
            systemProperty 'kitsunebi.verifyGeckoServer', 'true'
        }
        geckoWearerClient {
            client()
            gameDirectory = file('build/gecko-wearer-client')
            programArguments.addAll '--width', '960', '--height', '720', '--username', 'GeckoWearer', '--quickPlayMultiplayer', '127.0.0.1:25612'
            systemProperty 'kitsunebi.verifyGeckoNetwork', 'true'
        }
        skinFitClient {
            client()
            gameDirectory = file('build/gecko-skin-fit-client')
            programArguments.addAll '--width', '1200', '--height', '900', '--username', 'GeckoWearer', '--quickPlayMultiplayer', '127.0.0.1:25612'
            systemProperty 'kitsunebi.verifyGeckoNetwork', 'true'
            systemProperty 'kitsunebi.verifySkinFit', 'true'
        }
        geckoObserverClient {
            client()
            gameDirectory = file('build/gecko-observer-client')
            programArguments.addAll '--width', '1200', '--height', '900', '--username', 'GeckoObserver', '--quickPlayMultiplayer', '127.0.0.1:25612'
            systemProperty 'kitsunebi.verifyGeckoNetwork', 'true'
        }
        shukoNpcVerifyClient {
            client()
            gameDirectory = file('build/shuko-npc-client')
            programArguments.addAll '--width', '1200', '--height', '900'
            systemProperty 'kitsunebi.verifyShukoNpc', 'true'
        }
        geckoVerifyClient {
            client()
            gameDirectory = file('build/gecko-verify-client')
            programArguments.addAll '--width', '1200', '--height', '900'
            systemProperty 'kitsunebi.verifyGecko', 'true'
        }
        altarVerifyClient {
            client()
            gameDirectory = file('build/altar-verify-client')
            programArguments.addAll '--width', '960', '--height', '720'
            systemProperty 'kitsunebi.verifyAltarGui', 'true'
        }
        slopeVerifyServer {
            server()
            gameDirectory = file('build/slope-verify-server')
            programArgument '--nogui'
            systemProperty 'kitsunebi.verifySlopeMovement', 'true'
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('../common-1.21.1/src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../common-1.21.1/src/main/resources/').getAbsolutePath()
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_group_id           : mod_group_id,
            architectury_version   : architectury_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Optional integrations: only the selected viewer is loaded in development.
sourceSets.main.java.srcDir file("../compat-1.21.1/src/main/java")
dependencies {
    implementation "dev.architectury:architectury-neoforge:${project.architectury_version}"
    compileOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
    compileOnly "dev.emi:emi-neoforge:1.1.24+1.21.1"
    compileOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799"
    compileOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    if (providers.gradleProperty('curiosEnabled').getOrElse('true').toBoolean()) runtimeOnly "top.theillusivec4.curios:curios-neoforge:9.5.1+1.21.1"
    def viewer = providers.gradleProperty('recipeViewer').getOrElse('jei')
    if (viewer == 'jei') runtimeOnly "mezz.jei:jei-1.21.1-neoforge:19.21.0.247"
    if (viewer == 'emi') runtimeOnly "dev.emi:emi-neoforge:1.1.24+1.21.1"
    if (viewer == 'rei') runtimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.799"
}

// Keep this explicitly requested prototype separate from the stable JARs.
ext.releasePreview = true
tasks.named('jar') { archiveClassifier = 'gecko-preview' }
tasks.named('sourcesJar') { archiveClassifier = 'gecko-preview-sources' }
apply from: '../gradle/stage-release.gradle'

// NeoForge-only Shuko armor rendering prototype.
repositories { maven { name = 'GeckoLib'; url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'; content { includeGroup 'software.bernie.geckolib' } } }
dependencies { implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.9.3' }


tasks.named('runGeckoVerifyClient') {
    doFirst { delete 'build/gecko-verify-client/gecko-verification.txt' }
    doLast {
        def result=file('build/gecko-verify-client/gecko-verification.txt')
        if(!result.exists()||!result.text.startsWith('PASS:')) throw new GradleException(result.exists()?result.text:'Gecko render verification incomplete')
    }
}

tasks.named('runGeckoObserverClient') {
    doFirst { delete 'build/gecko-observer-client/gecko-network-verification.txt'; delete 'build/gecko-observer-client/gecko-player-poses.txt' }
    doLast {
        def result=file('build/gecko-observer-client/gecko-network-verification.txt')
        if(!result.exists()||!result.text.startsWith('PASS:')) throw new GradleException('Gecko multiplayer verification incomplete')
        def poses=file('build/gecko-observer-client/gecko-player-poses.txt')
        if(!poses.exists()||!poses.text.startsWith('PASS:')) throw new GradleException('Gecko player pose verification incomplete')
    }
}



tasks.named('runSkinFitClient') {
    doFirst { delete 'build/gecko-skin-fit-client/gecko-player-poses.txt' }
    doLast {
        def result=file('build/gecko-skin-fit-client/gecko-player-poses.txt')
        if(!result.exists()||!result.text.startsWith('PASS:')) throw new GradleException(result.exists()?result.text:'Skin fit verification incomplete')
    }
}


// A fresh flat world is created by the opt-in NPC fixture; user saves are never opened.
tasks.named('runShukoNpcVerifyClient') {
    doFirst { delete 'build/shuko-npc-client/shuko-npc-verification.txt' }
    doLast {
        def result = file('build/shuko-npc-client/shuko-npc-verification.txt')
        if (!result.exists() || !result.text.startsWith('PASS:'))
            throw new GradleException(result.exists() ? result.text : 'Shuko NPC world/render verification incomplete')
    }
}
