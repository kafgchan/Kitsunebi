modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="icon.png"
description='''
A lightweight standalone mod inspired by the Kitsunebi from Bamboo Mod. Adds customizable invisible and decorative lighting with colorful flames.
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="architectury"
    type="required"
    versionRange="[${architectury_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="jei"
type="optional"
versionRange="[19,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="roughlyenoughitems"
type="optional"
versionRange="[16,)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
type="optional"
versionRange="[1.1,)"
ordering="AFTER"
side="CLIENT"
