plugins {
    id 'net.neoforged.moddev' version '2.0.148' apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'eclipse'
    apply plugin: 'maven-publish'

    // JDT owns its output; Gradle/Loom run preparation must not write into it.
    eclipse.classpath {
        baseSourceOutputDir = layout.buildDirectory.dir('jdt/classes')
        defaultOutputDir = layout.buildDirectory.dir('jdt/default').get().asFile
        file.whenMerged { classpath ->
            classpath.entries.findAll { it instanceof org.gradle.plugins.ide.eclipse.model.SourceFolder }.each { entry ->
                def scope = entry.entryAttributes['gradle_scope'] ?: 'main'
                entry.output = "build/jdt/classes/${scope}"
            }
        }
    }
    eclipse.jdt.file.withProperties { properties ->
        // Shared methods are deprecated only on NeoForge, not on the Fabric/common API.
        properties['org.eclipse.jdt.core.compiler.problem.unusedWarningToken'] = 'ignore'
    }

    version = project.mod_version
    group = project.mod_group_id

    repositories {
        mavenCentral()
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://maven.theillusivec4.top' }
        maven { url = 'https://maven.terraformersmc.com/releases' }
        maven { url = 'https://maven.shedaniel.me' }
        maven { url = 'https://maven.architectury.dev' }
        maven {
            name = 'Sponge / Mixin'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release = 21
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        withSourcesJar()
    }
}
